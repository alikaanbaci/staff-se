<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b6fe0"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="480" fill="#f8fafc"/>

  <!-- KRaft Controller -->
  <rect x="290" y="8" width="240" height="42" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="410" y="26" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">KRaft Controller</text>
  <text x="410" y="41" text-anchor="middle" font-size="10.5" fill="#64748b">metadata &amp; leader election</text>
  <line x1="410" y1="50" x2="410" y2="72" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowGray)"/>

  <!-- Producers -->
  <rect x="20" y="195" width="150" height="90" rx="10" fill="#0f1c3f"/>
  <text x="95" y="235" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Producer'lar</text>
  <text x="95" y="255" text-anchor="middle" font-size="11" fill="#bfd0f5">event yazar</text>

  <line x1="170" y1="240" x2="222" y2="240" stroke="#3b6fe0" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Topic container -->
  <rect x="228" y="72" width="340" height="380" rx="12" fill="#eef1f8" stroke="#3b6fe0" stroke-width="2"/>
  <text x="398" y="96" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f1c3f">Topic: payments</text>

  <!-- Partition 0 -->
  <rect x="252" y="112" width="292" height="92" rx="8" fill="#ffffff" stroke="#3b6fe0" stroke-width="1.5"/>
  <text x="268" y="134" font-size="12.5" font-weight="700" fill="#0f1c3f">Partition 0</text>
  <text x="268" y="153" font-size="11" fill="#334155">Leader: Broker 1</text>
  <text x="268" y="169" font-size="11" fill="#64748b">Replicas: Broker 2, 3</text>
  <text x="268" y="190" font-size="10" fill="#94a3b8">append-only log</text>

  <!-- Partition 1 -->
  <rect x="252" y="218" width="292" height="92" rx="8" fill="#ffffff" stroke="#3b6fe0" stroke-width="1.5"/>
  <text x="268" y="240" font-size="12.5" font-weight="700" fill="#0f1c3f">Partition 1</text>
  <text x="268" y="259" font-size="11" fill="#334155">Leader: Broker 2</text>
  <text x="268" y="275" font-size="11" fill="#64748b">Replicas: Broker 1, 3</text>
  <text x="268" y="296" font-size="10" fill="#94a3b8">append-only log</text>

  <!-- Partition 2 -->
  <rect x="252" y="324" width="292" height="92" rx="8" fill="#ffffff" stroke="#3b6fe0" stroke-width="1.5"/>
  <text x="268" y="346" font-size="12.5" font-weight="700" fill="#0f1c3f">Partition 2</text>
  <text x="268" y="365" font-size="11" fill="#334155">Leader: Broker 3</text>
  <text x="268" y="381" font-size="11" fill="#64748b">Replicas: Broker 1, 2</text>
  <text x="268" y="402" font-size="10" fill="#94a3b8">append-only log</text>

  <!-- Arrows partitions -> consumers -->
  <line x1="568" y1="158" x2="622" y2="158" stroke="#3b6fe0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="568" y1="264" x2="622" y2="264" stroke="#3b6fe0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="568" y1="370" x2="622" y2="370" stroke="#3b6fe0" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Consumer group container -->
  <rect x="628" y="72" width="352" height="380" rx="12" fill="#eef1f8" stroke="#3b6fe0" stroke-width="2"/>
  <text x="804" y="96" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f1c3f">Consumer Group: payments-service</text>

  <rect x="652" y="112" width="304" height="92" rx="8" fill="#ffffff" stroke="#3b6fe0" stroke-width="1.5"/>
  <text x="668" y="134" font-size="12.5" font-weight="700" fill="#0f1c3f">Consumer A</text>
  <text x="668" y="153" font-size="11" fill="#334155">reads Partition 0</text>
  <text x="668" y="169" font-size="10" fill="#94a3b8">offset → __consumer_offsets</text>

  <rect x="652" y="218" width="304" height="92" rx="8" fill="#ffffff" stroke="#3b6fe0" stroke-width="1.5"/>
  <text x="668" y="240" font-size="12.5" font-weight="700" fill="#0f1c3f">Consumer B</text>
  <text x="668" y="259" font-size="11" fill="#334155">reads Partition 1</text>
  <text x="668" y="275" font-size="10" fill="#94a3b8">offset → __consumer_offsets</text>

  <rect x="652" y="324" width="304" height="92" rx="8" fill="#ffffff" stroke="#3b6fe0" stroke-width="1.5"/>
  <text x="668" y="346" font-size="12.5" font-weight="700" fill="#0f1c3f">Consumer C</text>
  <text x="668" y="365" font-size="11" fill="#334155">reads Partition 2</text>
  <text x="668" y="381" font-size="10" fill="#94a3b8">offset → __consumer_offsets</text>

  <!-- controller dashed lines to topic and consumer group -->
  <line x1="360" y1="60" x2="360" y2="72" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowGray)"/>
  <line x1="460" y1="60" x2="460" y2="72" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowGray)"/>
</svg>
